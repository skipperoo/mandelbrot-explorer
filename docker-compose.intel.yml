services:
# C Backend Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandelbrot_backend
    restart: unless-stopped
    user: 1000:109
    environment:
      - MANDELBROT_THREADS=0
      - MANDELBROT_SCALAR=0  # Set to 1 to force scalar mode
      - MANDELBROT_INTEL_GPU=1     # Set to 1 to enable GPU acceleration
      # - MESA_LOADER_DRIVER_OVERRIDE=iris
      - LIBGL_ALWAYS_SOFTWARE=0 
    expose:
      - "8080" # Only exposed to internal Docker network, not the host
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
            
  # Nginx Frontend Service
  frontend:
    build: ./frontend
    container_name: mandelbrot_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Map host port 80 to container port 80
    depends_on:
      - backend
