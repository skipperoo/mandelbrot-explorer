services:
# C Backend Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.nvidia

    container_name: mandelbrot_backend
    restart: unless-stopped
    environment:
      - MANDELBROT_THREADS=0
      - MANDELBROT_NVIDIA_GPU=1     # Set to 1 to enable GPU acceleration
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - 8080:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

