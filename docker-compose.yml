services:
# C Backend Service
  backend:
    build: ./backend
    container_name: mandelbrot_backend
    restart: unless-stopped
    environment:
      - MANDELBROT_THREADS=12
      - MANDELBROT_SIMD=1  # Set to 1 to force scalar mode
    expose:
      - "8080" # Only exposed to internal Docker network, not the host
  # Nginx Frontend Service
  frontend:
    build: ./frontend
    container_name: mandelbrot_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Map host port 80 to container port 80
    depends_on:
      - backend
