# frontend/nginx.conf

server {
    listen 80;
    server_name localhost;

    # 1. Serve Static Frontend Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy WebSockets to the Backend
    location /ws {
        # 'backend' matches the service name in docker-compose.yml
        proxy_pass http://backend:8080;
        
        # Required headers for WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Forward IP info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Long timeout prevents Nginx from killing the connection during long renders
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
